    <!-- Cross-Browser Self-Healing & Stale Cache/ServiceWorker Recovery -->
    <script>
      (function() {
        // Prevent broken or stale development service workers from blocking Chrome/Edge/Firefox
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                var reg = registrations[i];
                // Unregister dev-sw or broken workers that intercept localhost or cloud run dev domains
                if (reg.active && (reg.active.scriptURL.includes('dev-sw') || window.location.hostname.includes('run.app') || window.location.hostname === 'localhost')) {
                  reg.unregister().then(function(unregistered) {
                    if (unregistered) console.log('Cleaned stale development service worker for smooth browser loading.');
                  });
                }
              }
            }).catch(function() {});
          } catch(e) {}
        }
      })();
    </script>
